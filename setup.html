<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Buka-Ini ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --bg-gradient: linear-gradient(135deg, #ffb3c6, #ff8fa3, #ff4d6d);
        }
        body, html {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: #333;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.4); }
        p.desc { text-align: center; color: #fff; font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #4a0414; }
        input[type="text"] {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ffb3c6;
            background: rgba(255,255,255,0.8); font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .btn {
            background: #ff4d6d; color: #fff; border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: 600; border-radius: 30px; cursor: pointer;
            width: 100%; transition: 0.3s; margin-top: 15px;
        }
        .btn:hover { background: #e03e5c; transform: translateY(-2px); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #fff; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-link {
            word-break: break-all; font-size: 0.85rem; color: #000;
            background: #fff; padding: 10px; border-radius: 8px; border: 1px dashed #ff4d6d;
            margin: 10px 0;
        }
        .btn-copy { background: #333; }
        .btn-copy:hover { background: #000; }
        .note { font-size: 0.8rem; color: #4a0414; margin-top: 5px; display: block; }
        
        @media (max-width: 600px) {
            .container { padding: 15px; margin: 0; }
            h2 { font-size: 1.5rem; }
            p.desc { font-size: 0.85rem; }
            .btn { font-size: 1rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💌 Link Generator 💌</h2>
        <p class="desc">Isi semua form di bawah untuk merakit website romantis milikmu sendiri. Wajib diisi!</p>
        
        <div class="form-group">
            <label>Nama Dia (Penerima)</label>
            <input type="text" id="inpTo" placeholder="Contoh: Aneyy">
        </div>
        
        <div class="form-group">
            <label>Nama Kamu (Pengirim)</label>
            <input type="text" id="inpFrom" placeholder="Contoh: Agim">
        </div>
        
        <div class="form-group">
            <label>Hal yang bikin baper dari dia</label>
            <input type="text" id="inpReason" placeholder="Contoh: kamu selalu sabar dengerin ceritaku">
        </div>
        
        <div class="form-group">
            <label>Pesan Pribadi Tambahan</label>
            <input type="text" id="inpMsg" placeholder="Contoh: Aku sayang kamu selamanya...">
        </div>
        
        <div class="form-group">
            <label>Nomor WhatsApp Kamu</label>
            <input type="text" id="inpWA" placeholder="Contoh: 08123456789">
            <span class="note">*Agar saat dia klik 'Peluk Jauh', otomatis ngirim pesan WA ke kamu tanda dia terima!</span>
        </div>
        
        <div class="form-group">
            <label>Link Foto (Opsional)</label>
            <input type="text" id="inpPhoto" placeholder="https://contoh.com/foto.jpg">
            <span class="note">*Support direct link & Google Drive (Pastikan setting GDrive: Anyone with the link)</span>
        </div>
        
        <button class="btn" onclick="generateLink()">Buat Link Rahasia ✨</button>
        
    </div>
    
    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2 style="color: #ff4d6d; text-shadow: none; margin-top: 0;">Link Siap! 🎉</h2>
            <label style="color: #333;">Copy & kirim link rahasia ini ke dia:</label>
            <div class="result-link" id="resultLink"></div>
            <button class="btn btn-copy" onclick="copyLink()">📋 Copy Link</button>
            <button class="btn" style="background:#fff; color:#ff4d6d; border: 2px solid #ff4d6d;" onclick="testLink()">👀 Test Buka Link</button>
            <button class="btn" style="background:transparent; color:#888; font-size:0.9rem; padding: 5px; margin-top:10px; box-shadow:none;" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        let generatedUrl = '';
        
        // Smart Converter untuk Google Drive Link (Anti-CORS / Anti-Blocked)
        function convertGoogleDriveLink(url) {
            if (!url) return url;
            
            // Pola 1: drive.google.com/file/d/ID/view
            const regex1 = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
            // Pola 2: drive.google.com/open?id=ID
            const regex2 = /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/;
            // Pola 3: drive.google.com/uc?id=ID (Format lama)
            const regex3 = /drive\.google\.com\/uc\?.*?id=([a-zA-Z0-9_-]+)/;
            
            let id = null;
            if (url.match(regex1)) id = url.match(regex1)[1];
            else if (url.match(regex2)) id = url.match(regex2)[1];
            else if (url.match(regex3)) id = url.match(regex3)[1];
            
            if (id) {
                // Gunakan endpoint thumbnail agar terhindar dari blokir "Cross-Origin-Resource-Policy: same-site"
                return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
            }
            return url;
        }
        
        function generateLink() {
            const to = document.getElementById('inpTo').value.trim();
            const from = document.getElementById('inpFrom').value.trim();
            const reason = document.getElementById('inpReason').value.trim();
            const msg = document.getElementById('inpMsg').value.trim();
            let wa = document.getElementById('inpWA').value.trim().replace(/[^0-9]/g, ''); // Hanya ambil angka
            
            if (!to || !from || !reason || !msg || !wa) {
                alert("Mohon isi semua kolom (kecuali Link Foto) agar hasilnya sempurna!");
                return;
            }
            
            // Format otomatis ke 62 (Kode Negara Indonesia)
            if (wa.startsWith('0')) {
                wa = '62' + wa.substring(1);
            } else if (wa.startsWith('8')) {
                wa = '62' + wa;
            }
            
            let photo = document.getElementById('inpPhoto').value.trim();
            
            // Convert Google Drive link jika ada
            photo = convertGoogleDriveLink(photo);
            
            // Dapatkan base url tempat setup.html berada
            let baseUrl = window.location.href.split('?')[0].replace('setup.html', '').replace(/\/$/, '') + '/index.html';
            
            // Fallback jika baseUrl jadi aneh
            if (!baseUrl.includes('index.html')) {
                const parts = window.location.href.split('?')[0].split('/');
                parts.pop();
                baseUrl = parts.join('/') + '/index.html';
            }
            
            const dataObj = {};
            if (to) dataObj.to = to;
            if (from) dataObj.from = from;
            if (reason) dataObj.reason = reason;
            if (msg) dataObj.msg = msg;
            if (wa) dataObj.wa = wa;
            if (photo) dataObj.photo = photo;
            
            if (Object.keys(dataObj).length > 0) {
                // Konversi objek ke JSON string
                const jsonStr = JSON.stringify(dataObj);
                // Enkripsi (Base64) dengan support karakter Emoji/Unicode
                const base64Str = window.btoa(unescape(encodeURIComponent(jsonStr)));
                // Hilangkan padding "=" agar lebih bersih
                const cleanBase64 = base64Str.replace(/=+$/, '');
                generatedUrl = `${baseUrl}?data=${cleanBase64}`;
            } else {
                generatedUrl = baseUrl;
            }
            
            document.getElementById('resultLink').innerText = generatedUrl;
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
        
        function copyLink() {
            navigator.clipboard.writeText(generatedUrl).then(() => {
                alert("Link berhasil di-copy! Silakan paste di WhatsApp/Chat.");
            }).catch(err => {
                // Fallback copy
                const el = document.createElement('textarea');
                el.value = generatedUrl;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                alert("Link berhasil di-copy! Silakan paste di WhatsApp/Chat.");
            });
        }
        
        function testLink() {
            if (generatedUrl) {
                window.open(generatedUrl, '_blank');
            }
        }
    </script>
</body>
</html>
